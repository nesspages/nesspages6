<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b7a4b">
<title>NessPages UNNES | Sirkulasi Literatur Akademik Kampus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0b7a4b;--g2:#065f3b;--g3:#10b981;--mint:#ecfdf5;--mint2:#d1fae5;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f4f9f6;--card:#fff;--red:#e11d48;--amb:#b45309;--ambbg:#fef3c7;--r:16px;--sh:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:20px}
.row{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}.wr{flex-wrap:wrap}
.mut{color:var(--mut)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:700}.xb{font-weight:800}
.g{color:var(--g)}
.ic{display:inline-block;vertical-align:-3px;flex:none}
/* header */
.hd{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd>div{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--g2)}
.lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0b7a4b,#065f3b);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.5px}
.hs{flex:1;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:8px;background:#f1f5f9;border-radius:999px;padding:8px 14px;color:var(--mut)}
.hs input{flex:1;background:none;border:0;outline:0;min-width:0}
.hd nav{display:flex;gap:4px}
.hd nav a{padding:8px 12px;border-radius:10px;font-weight:600;color:#334155;position:relative}
.hd nav a:hover,.hd nav a.on{background:var(--mint);color:var(--g2)}
.hd nav i{font-style:normal;background:var(--g);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;margin-left:5px}
.usr{display:flex;align-items:center;gap:10px;text-align:right;line-height:1.2}
.usr small{display:block;color:var(--g);font-size:11px;font-weight:600}
.av{width:36px;height:36px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;font-style:normal;font-weight:700;color:#64748b}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:700;border:1.5px solid transparent;transition:.15s;white-space:nowrap}
.bp{background:var(--g);color:#fff}.bp:hover{background:var(--g2)}
.bo{border-color:var(--g);color:var(--g);background:#fff}.bo:hover{background:var(--mint)}
.bg{background:#f1f5f9;color:#334155}.bg:hover{background:#e2e8f0}
.bd{background:#1e293b;color:#fff}.bd:hover{background:#0f172a}
.br{background:#fff;border-color:#fecdd3;color:var(--red)}.br:hover{background:#fff1f2}
.btn.sm{padding:6px 12px;border-radius:9px;font-size:12px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
/* chips */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#f1f5f9;color:#334155}
.bgg{background:var(--mint2);color:var(--g2)}.bga{background:var(--ambbg);color:var(--amb)}.bgr{background:#ffe4e6;color:#be123c}.bgb{background:#dbeafe;color:#1d4ed8}
/* forms */
label.l{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#475569;margin-bottom:6px}
.in,.sel,.ta{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:0;transition:.15s}
.in:focus,.sel:focus,.ta:focus{border-color:var(--g3);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.in[readonly]{background:#f8fafc;color:#475569}
.ta{resize:vertical;min-height:90px}
.err{color:var(--red);font-size:12px;margin-top:4px;min-height:0}
.fg{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.sec-t{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin-bottom:16px}
.sec-t:before{content:'';width:4px;height:20px;border-radius:4px;background:var(--g)}
/* hero */
.hero{background:radial-gradient(900px 400px at 85% 0,#d1fae5,transparent 60%),linear-gradient(#f0fdf4,#f4f9f6)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding-top:48px;padding-bottom:48px}
.hero h1{font-size:44px;line-height:1.1;font-weight:800;letter-spacing:-1.2px}
.hero h1 u{text-decoration:none;color:var(--g);background:linear-gradient(transparent 82%,#f59e0b 82% 90%,transparent 90%)}
.hero p{margin:16px 0 24px;color:#475569;font-size:16px;max-width:480px}
.stack{position:relative;height:290px}
.stack .cover{position:absolute;box-shadow:0 20px 30px rgba(15,23,42,.25)}
section.s{padding:34px 0}
.h2{font-size:22px;font-weight:800;letter-spacing:-.4px}
.eyb{font-size:11px;font-weight:800;color:var(--g);letter-spacing:.08em;text-transform:uppercase}
.fgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:18px}
.fk{padding:16px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);transition:.2s;display:block}
.fk:hover{transform:translateY(-3px);border-color:var(--g3)}
.fk .fi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:12px;margin-bottom:10px}
.fk b{display:block}.fk small{color:var(--mut);font-size:11px}
.fk .n{float:right;font-size:11px;color:var(--mut);background:#f1f5f9;border-radius:99px;padding:2px 8px}
/* cover/scene */
.cover{width:9em;aspect-ratio:3/4;font-size:var(--s,10px);border-radius:.4em .7em .7em .4em;background:linear-gradient(155deg,var(--c1),#0f172a 130%);color:#fff;padding:1em .9em .8em 1.2em;display:flex;flex-direction:column;position:relative;overflow:hidden;border-left:.55em solid rgba(0,0,0,.28)}
.cover:after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,.22),transparent 30%)}
.cover .cv-top{font-style:normal;font-size:.62em;font-weight:800;letter-spacing:.14em;opacity:.85}
.cover h4{font-size:1.12em;line-height:1.15;font-weight:800;margin:.7em 0 auto;text-transform:uppercase;letter-spacing:-.01em}
.cover .cv-ch{width:100%;margin:.6em 0;opacity:.9}
.cover span{font-size:.66em;font-weight:600;opacity:.92;border-top:1px solid rgba(255,255,255,.4);padding-top:.5em}
.scene{position:relative;overflow:hidden;display:grid;place-items:center;aspect-ratio:4/3;border-radius:14px}
.scene .cover{transform:rotate(-3deg);box-shadow:0 14px 24px rgba(0,0,0,.35)}
.scene .real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.scene.ph img{width:100%;height:100%;object-fit:cover}
.sc0{background:radial-gradient(circle at 15% 25%,rgba(255,228,170,.7) 0 6%,transparent 7%),radial-gradient(circle at 80% 18%,rgba(255,255,255,.5) 0 5%,transparent 6%),radial-gradient(circle at 65% 70%,rgba(255,210,140,.35) 0 9%,transparent 10%),linear-gradient(165deg,#d8b98c,#9c6b43 55%,#5f3b22)}
.sc1{background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.35) 0 4%,transparent 5%),radial-gradient(circle at 75% 30%,rgba(255,200,120,.45) 0 7%,transparent 8%),radial-gradient(circle at 50% 78%,rgba(255,255,255,.2) 0 8%,transparent 9%),linear-gradient(170deg,#334155,#7c4a25 70%,#4a2c15)}
.sc2{background:radial-gradient(circle at 80% 15%,#fff 0 12%,transparent 13%),radial-gradient(circle at 20% 70%,rgba(255,255,255,.7) 0 8%,transparent 9%),linear-gradient(170deg,#f1f5f9,#e5d9c3 70%,#cdb48c)}
.open{display:flex;font-size:var(--s,10px);width:21em;transform:rotate(-2deg);filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
.open .pg{flex:1;background:#fffef9;padding:1.2em;aspect-ratio:3/4;display:flex;flex-direction:column;gap:.55em}
.open .pg:first-child{border-radius:.4em 0 0 .4em;background:linear-gradient(90deg,#fffef9 85%,#e8e2d0)}
.open .pg:last-child{border-radius:0 .4em .4em 0;background:linear-gradient(270deg,#fffef9 85%,#e8e2d0)}
.open u{display:block;height:.45em;background:#cbd5e1;border-radius:9px}
.open u.hl{background:#fde047}
.open u.s{width:60%}
.spines{display:flex;gap:.3em;align-items:flex-end;font-size:var(--s,10px)}
.spines i{display:block;width:3.2em;border-radius:.3em;box-shadow:0 8px 14px rgba(0,0,0,.3);background:linear-gradient(90deg,rgba(255,255,255,.25),transparent 25%),var(--c)}
.tbl{font-size:var(--s,10px);background:#fff;border-radius:1em;padding:1.2em;width:20em;box-shadow:0 14px 20px rgba(0,0,0,.25);transform:rotate(2deg)}
.tbl b{display:block;font-size:1.1em;margin-bottom:.6em;color:var(--g2)}
.tbl div{display:grid;grid-template-columns:repeat(4,1fr);gap:.3em}
.tbl i{height:1.3em;background:#e2e8f0;border-radius:.2em}.tbl i:nth-child(-n+4){background:var(--g3)}
/* book card */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.bgrid.c4{grid-template-columns:repeat(4,1fr)}
.bc{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:.2s}
.bc:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(15,23,42,.12)}
.bc .scene{border-radius:0;aspect-ratio:16/10}
.bc .tg{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:3}
.bc .bd2{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.bc .mk{font-size:10.5px;font-weight:800;color:var(--g);text-transform:uppercase;letter-spacing:.03em}
.bc h3{font-size:15.5px;line-height:1.3;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.bc .au{font-size:12px;color:var(--mut)}
.pr{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:8px}
.pr small{display:block;font-size:10px;color:var(--mut);font-weight:600}
.pr b{font-size:17px;font-weight:800}
.pr .o{color:var(--amb);text-align:right}.pr .o b{font-size:13px}
.bc .ac{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;margin-top:10px}
/* catalog layout */
.cl{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
.side{position:sticky;top:76px;display:grid;gap:14px}
.ck{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer;font-size:13px}
.ck input{accent-color:var(--g);width:16px;height:16px}
.ck em{margin-left:auto;font-style:normal;font-size:11px;color:var(--mut)}
.pg-n{display:flex;gap:6px;justify-content:center;margin-top:22px}
.pg-n button{min-width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:700}
.pg-n button.on{background:var(--g);color:#fff;border-color:var(--g)}
/* detail */
.dl{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.thumbs button{border-radius:12px;overflow:hidden;position:relative;border:2px solid transparent;aspect-ratio:4/3;padding:0}
.thumbs button.on{border-color:var(--g)}
.thumbs button .scene{aspect-ratio:auto;height:100%;border-radius:0}
.thumbs button span{position:absolute;left:0;right:0;bottom:0;background:rgba(15,23,42,.7);color:#fff;font-size:10px;padding:2px;text-align:center;font-weight:600}
.thumbs .cover,.thumbs .open,.thumbs .spines,.thumbs .tbl{--s:5px}
.mainimg{position:relative}
.mainimg .scene{aspect-ratio:4/3.2}
.mainimg .bdg{position:absolute;z-index:4}
.zoom{position:absolute;right:12px;bottom:12px;z-index:4;background:rgba(15,23,42,.75);color:#fff;padding:6px 12px;border-radius:9px;font-size:12px;font-weight:600}
.okbox{background:var(--mint);border:1px solid #a7f3d0;border-radius:var(--r);padding:16px;display:flex;gap:12px}
.okic{width:36px;height:36px;border-radius:11px;background:var(--g);color:#fff;display:grid;place-items:center;flex:none}
.ci{display:flex;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px}
.ci.w{background:#fffbeb;border-color:#fde68a}
.ci .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--g3);flex:none}
.ci.w .d{background:#f59e0b}
.ci b{display:block;font-size:13px}.ci span{font-size:12px;color:var(--mut)}
.info{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;margin:14px 0}
.opt{position:relative;border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff;transition:.15s;display:block}
.opt input{position:absolute;opacity:0}
.opt.on{border-color:var(--g);background:var(--mint)}
.opt .pp{font-size:24px;font-weight:800;margin:4px 0}
.opt s{font-size:11px;color:var(--mut)}
.opt .rb{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;border:2px solid #cbd5e1;display:grid;place-items:center;color:#fff}
.opt.on .rb{background:var(--g);border-color:var(--g)}
.slr{display:flex;gap:12px;align-items:center}
.pic{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#10b981,#065f3b);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stp{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.stp .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e2e8f0;font-weight:800;font-size:12px;flex:none}
.stp.on{border-color:var(--g3);background:var(--mint)}.stp.on .n,.stp.dn .n{background:var(--g);color:#fff}
.stp small{display:block;color:var(--mut);font-size:11px}
.co{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.rd{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;margin-bottom:8px}
.rd input{accent-color:var(--g);margin-top:3px}
.rd.on{border-color:var(--g);background:var(--mint)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slots button{padding:9px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-weight:600;font-size:13px}
.slots button.on{background:var(--g);color:#fff;border-color:var(--g)}
.sumr{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.tot{background:var(--mint);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.tot b{font-size:22px;color:var(--g2)}
/* timeline */
.tl{position:relative;padding-left:46px}
.tl:before{content:'';position:absolute;left:17px;top:12px;bottom:12px;width:2px;background:var(--line)}
.ts{position:relative;padding:12px 14px;margin-bottom:10px;border-radius:14px}
.ts .dt{position:absolute;left:-46px;top:10px;width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;color:#94a3b8;font-weight:800}
.ts.dn .dt{background:var(--g);border-color:var(--g);color:#fff}
.ts.cu{background:var(--mint);border:1px solid #a7f3d0}.ts.cu .dt{border-color:var(--g);color:var(--g)}
.ts b{display:block}.ts span{font-size:12px;color:var(--mut)}
.otp{font-size:40px;font-weight:800;letter-spacing:.3em;text-align:center;color:var(--g2);background:var(--mint);border-radius:14px;padding:14px 0 14px .3em;font-variant-numeric:tabular-nums}
.tabs{display:inline-flex;background:#e8f0ec;border-radius:12px;padding:4px;gap:4px}
.tabs button{padding:8px 16px;border-radius:9px;font-weight:700;color:#475569}
.tabs button.on{background:#fff;color:var(--g2);box-shadow:var(--sh)}
.banner{background:linear-gradient(95deg,#0b7a4b,#10b981);color:#fff;border-radius:16px;padding:18px 22px;display:flex;gap:14px;align-items:center}
.safe li{list-style:none;display:flex;gap:9px;margin-bottom:10px;font-size:13px}
/* chat */
.chat{display:flex;flex-direction:column;height:560px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fafcfb}
.m{max-width:75%;padding:10px 14px;border-radius:16px;font-size:13.5px}
.m small{display:block;font-size:10px;opacity:.7;margin-top:3px;text-align:right}
.m.me{align-self:flex-end;background:var(--g);color:#fff;border-bottom-right-radius:4px}
.m.th{align-self:flex-start;background:#e9eef2;border-bottom-left-radius:4px}
.m.sy{align-self:center;background:#fff;border:1px solid var(--line);text-align:center;font-size:12px;color:#475569;max-width:80%}
.qk{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 0}
.qk button{padding:6px 12px;border-radius:99px;background:#f1f5f9;font-size:12px;font-weight:600}
.qk button:hover{background:var(--mint2)}
.cb{display:flex;gap:10px;padding:12px 16px}
/* admin */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi .card{padding:16px}
.kpi small{font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.kpi b{display:block;font-size:26px;font-weight:800;margin-top:4px}
.bars .br2{margin-bottom:14px}
.bars .tp{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px}
.bars .tr{height:7px;background:#f1f5f9;border-radius:9px;overflow:hidden}
.bars .tr i{display:block;height:100%;border-radius:9px}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex:none}
.donut:after{content:'';position:absolute;inset:26px;background:#fff;border-radius:50%}
.donut div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:2}
.donut b{font-size:26px;line-height:1}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:10px;border-bottom:1px solid var(--line)}
table.t td{padding:12px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tw{overflow:auto}
.lock{max-width:420px;margin:60px auto;text-align:center}
.lock .lic{width:60px;height:60px;border-radius:18px;background:var(--mint);color:var(--g);display:grid;place-items:center;margin:0 auto 14px}
/* footer */
footer{background:#0f172a;color:#cbd5e1;margin-top:50px;padding:44px 0 20px}
footer .fg2{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}
footer h5{color:#fff;font-size:14px;margin-bottom:12px}
footer a,footer p{display:block;font-size:12.5px;color:#94a3b8;margin-bottom:8px}
footer a:hover{color:#6ee7b7}
footer .cp{border-top:1px solid #1e293b;margin-top:30px;padding-top:18px;display:flex;justify-content:space-between;font-size:12px;color:#64748b;flex-wrap:wrap;gap:10px}
.pill{display:inline-block;background:#052e22;color:#6ee7b7;border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:600}
/* toast/modal */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;display:grid;gap:8px}
#toast div{background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:up .25s}
#toast div.e{background:#be123c}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:150;display:grid;place-items:center;padding:20px}
.md{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:24px;max-height:90vh;overflow:auto}
.ph-up{border:2px dashed #cbd5e1;border-radius:14px;padding:22px;text-align:center;cursor:pointer;background:#f8fafc}
.ph-up:hover{border-color:var(--g3);background:var(--mint)}
.pth{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.pth div{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1}
.pth img{width:100%;height:100%;object-fit:cover}
.pth button{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;line-height:1}
.crumb{font-size:12px;color:var(--mut);padding:14px 0}
.crumb b{color:var(--ink)}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}
@media(max-width:960px){
 .hd>div{flex-wrap:wrap;gap:10px}.hs{order:5;max-width:none;flex-basis:100%}
 .hero .wrap,.dl,.co,.cl{grid-template-columns:1fr}.hero h1{font-size:32px}.stack{height:230px}
 .bgrid,.bgrid.c4{grid-template-columns:1fr 1fr}.fgrid{grid-template-columns:repeat(2,1fr)}
 .kpi{grid-template-columns:1fr 1fr}.side{position:static}
 footer .fg2{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr}
 .g2,.g3,.g4{grid-template-columns:1fr}.hd nav a{padding:6px 8px}.usr span{display:none}
 .two{grid-template-columns:1fr!important}
}
@media(max-width:560px){.bgrid,.bgrid.c4{grid-template-columns:1fr}.hero h1{font-size:28px}}
.um{position:relative}.um .pop{display:none;position:absolute;right:0;top:50px;width:290px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(15,23,42,.18);padding:10px;z-index:60}
.um.show .pop{display:block}.usr{cursor:pointer}.pop a{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;font-weight:600;color:#334155}.pop a:hover{background:var(--mint);color:var(--g2)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#f1f5f9;border-radius:12px;padding:3px;margin:6px 0}.seg button{padding:8px;border-radius:10px;font-weight:700;color:#64748b}.seg button.on{background:#fff;color:var(--g2);box-shadow:var(--sh)}
.faq details{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;margin-bottom:8px}.faq summary{font-weight:700;cursor:pointer}.faq details[open]{border-color:var(--g3)}.faq p{margin-top:8px;color:#475569}
.bot{height:300px;overflow:auto;display:grid;align-content:start;gap:8px;padding:12px;background:#f8fafc}.bt{padding:9px 12px;border-radius:12px;max-width:88%;background:#fff;border:1px solid var(--line);font-size:13px}.bt.me{background:var(--g);color:#fff;justify-self:end;border:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}.chips button{background:#f1f5f9;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:600}.chips button:hover{background:var(--mint2)}
.pdp{scroll-margin-top:80px}.toc button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-weight:600;color:#475569}.toc button:hover{background:var(--mint);color:var(--g2)}

function sceneInner(b,k,s){
 if(k==='inside'){const ln=(n,hl)=>Array.from({length:n},(_,i)=>`<u class="${hl&&i===hl?'hl':''} ${i%4===3?'s':''}"></u>`).join('');return `<div class="open" style="--s:${s}px"><div class="pg"><u style="width:40%;background:var(--g3)"></u>${ln(11,4)}</div><div class="pg">${ln(12,7)}</div></div>`}
 if(k==='spine'){const f=FAK[b.fak];const cs=[f.c,'#334155','#0f766e','#7c2d12'];return `<div class="spines" style="--s:${s}px">${cs.map((c,i)=>`<i style="--c:${c};height:${(14+i%3*2)}em"></i>`).join('')}</div>`}
 if(k==='table'){return `<div class="tbl" style="--s:${s}px"><b>Tabel &amp; Ringkasan Bab</b><div>${'<i></i>'.repeat(20)}</div></div>`}
 return cover(b,s);
}

 return `<div class="scene sc${hashStr(b.id)%3} ${extra}">${real}${sceneInner(b,k,s)}</div>`}

const SEED_X=BOOKS.map((b,i)=>{const h=HH(b.id);if(h%100>=62)return null;const m=b.buy&&b.rent?((h>>2)%3===0?'beli':'sewa'):b.buy?'beli':'sewa',r=(h>>7)%20;return{id:'NP-ORD-2026-'+(5000+i),buyer:BUYERS[(h>>5)%BUYERS.length],seller:b.seller.name,title:b.title,fak:b.fak,model:m,pay:PAYS[(h>>3)%PAYS.length],total:(m==='sewa'?b.rent:b.buy)+2000,cod:b.cod,st:r<14?'selesai':r<18?'aktif':'batal'}}).filter(Boolean);

const allX=()=>SEED_X.concat(S.orders.map(o=>{const b=getBook(o.bookId);return{id:o.id,buyer:o.buyer||S.user.name,seller:b?b.seller.name:'-',title:b?b.title:'-',fak:b?b.fak:'-',model:o.mode,pay:o.pay||'QRIS Instan UNNES',total:o.total,cod:o.cod,st:o.status}}));
const cnt=(L,f)=>{const m={};L.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const okX=()=>allX().filter(x=>x.st!=='batal');
const SHARES=()=>{const X=okX(),n=Math.max(1,X.length),L=[['#e11d48','Kedokteran (FK)'],['#f59e0b','Ekonomi & Bisnis (FEB)'],['#f97316','Teknik (FT)'],['#06b6d4','MIPA (FMIPA)'],['#8b5cf6','Lainnya (FH, FIPP, FISIP, FBS, FIK)']],c=[0,0,0,0,0];X.forEach(x=>c[{FK:0,FEB:1,FT:2,FMIPA:3}[x.fak]??4]++);return L.map((l,i)=>[l[0],l[1],Math.round(c[i]/n*100)+'%',c[i]/n*100])};
const CONIC=()=>{let a=0;return 'conic-gradient('+SHARES().map(x=>{const s0=a;a+=x[3];return x[0]+' '+s0.toFixed(1)+'% '+a.toFixed(1)+'%'}).join(',')+')'};
const TOP2=()=>{const X=okX(),t=cnt(X,x=>x.fak).slice(0,2);return{n:t.map(x=>x[0]).join(' & ')+' UNNES',p:Math.round(t.reduce((a,x)=>a+x[1],0)/Math.max(1,X.length)*100)}};
const CODFAV=()=>{const X=okX();return cnt(X,x=>x.cod).slice(0,3).map(x=>[x[0],Math.round(x[1]/Math.max(1,X.length)*100)+'%'])};
const bars=(r,c)=>{const mx=Math.max(1,...r.map(x=>x[1]));return r.map(x=>`<div class="br2"><div class="tp"><span>${esc(x[0])}</span><span>${x[1]} transaksi</span></div><div class="tr"><i style="width:${x[1]/mx*100}%;background:${c}"></i></div></div>`).join('')};
const _adm=V.admin;
V.admin=()=>{_adm();if(!isAdmin())return;const w=$('#app .wrap');if(!w)return;
 const X=allX(),T=allT(),ok=X.filter(x=>x.st!=='batal'),sold=ok.filter(x=>x.model==='beli').length,rent=ok.filter(x=>x.model==='sewa').length,nil=ok.reduce((a,x)=>a+x.total,0);
 const bar=`<div class="tabs wr" style="margin-top:16px">${[['dash','Dashboard SIM'],['titip','Rekap Titip Jual ('+T.length+')'],['trx','Rekap Sewa & Beli ('+X.length+')']].map(t=>`<button class="${atop===t[0]?'on':''}" data-act="atop" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>`;
 const chip=(a,b)=>`<span class="card pad sm" style="padding:10px 14px"><b>${b}</b> ${a}</span>`;
 if(atop==='titip'){[...w.children].forEach((c,i)=>{if(i>0)c.remove()});
  w.insertAdjacentHTML('beforeend',bar+`<div class="row wr" style="margin:14px 0">${chip('Total penitip',new Set(T.map(x=>x.nim)).size)}${chip('Total listing',T.length)}${chip('Disetujui',T.filter(x=>x.st==='approved').length)}${chip('Menunggu',T.filter(x=>x.st==='pending').length)}${chip('Ditolak',T.filter(x=>x.st==='rejected').length)}<button class="btn bp sm" data-act="csv">${ic('dl',14)} Unduh CSV</button></div>`+tbl(['ID','Penitip','Fakultas','Judul Buku','Model','Harga','Status','Tanggal'],T.slice().reverse().map(x=>`<tr><td><code>${esc(x.id)}</code></td><td><b>${esc(x.name)}</b><div class="xs mut">${esc(x.nim)}</div></td><td>${esc(x.fak)}</td><td>${esc(x.title)}</td><td>${esc(x.model)}</td><td><b>${rp(x.price)}</b></td><td>${stb(x.st)}</td><td class="xs">${esc(x.at)}</td></tr>`)));return}
 if(atop==='trx'){[...w.children].forEach((c,i)=>{if(i>0)c.remove()});
  w.insertAdjacentHTML('beforeend',bar+`<div class="row wr" style="margin:14px 0">${chip('Total transaksi',X.length)}${chip('Nilai transaksi',rp(nil))}${chip('Buku terjual',sold)}${chip('Buku tersewa',rent)}${chip('Berjalan',X.filter(x=>x.st==='aktif').length)}${chip('Batal',X.filter(x=>x.st==='batal').length)}<button class="btn bp sm" data-act="csv">${ic('dl',14)} Unduh CSV</button></div>`+tbl(['ID Order','Pembeli','Penjual','Buku','Model','Pembayaran','Total','Titik COD','Status'],X.slice().reverse().map(x=>`<tr><td><code>${esc(x.id)}</code></td><td>${esc(x.buyer)}</td><td>${esc(x.seller)}</td><td>${esc(x.title)}</td><td>${x.model==='sewa'?'Sewa':'Beli'}</td><td>${esc(x.pay)}</td><td><b>${rp(x.total)}</b></td><td class="xs">${esc(x.cod)}</td><td>${stb(x.st)}</td></tr>`)));return}
 w.children[0].insertAdjacentHTML('afterend',bar);
 w.insertAdjacentHTML('beforeend',`<div class="kpi" style="margin-top:16px">${kp('Buku Terjual',sold,'dari '+allBooks().length+' judul di katalog')}${kp('Buku Tersewa',rent,'Tersedia '+(allBooks().length-sold-rent)+' judul')}${kp('Penitip Aktif',new Set(T.map(x=>x.nim)).size,T.length+' listing masuk')}${kp('Nilai Transaksi',rp(nil),'Tidak termasuk batal')}</div><div class="co two" style="margin-top:16px;grid-template-columns:1fr 1fr"><div class="card pad bars"><span class="eyb">Rekap dari data transaksi</span><h3 style="font-size:17px;font-weight:800;margin:4px 0 14px">Titik COD Paling Favorit</h3>${bars(cnt(ok,x=>x.cod).slice(0,5),'#0b7a4b')}</div><div class="card pad bars"><span class="eyb">Rekap dari data transaksi</span><h3 style="font-size:17px;font-weight:800;margin:4px 0 14px">Metode Pembayaran</h3>${bars(cnt(ok,x=>x.pay.replace(/ \(.*/,'')).slice(0,6),'#f59e0b')}</div></div>`)};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e)});
document.addEventListener('submit',e=>{const el=e.target.closest('[data-on-submit]');if(el&&ON[el.dataset.onSubmit])ON[el.dataset.onSubmit](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-on-change]');if(el&&CH[el.dataset.onChange])CH[el.dataset.onChange](el,e);
 if(e.target.id==='ph'){const files=[...e.target.files].slice(0,4-TJ.photos.length);Promise.all(files.map(compress)).then(r=>{r.filter(Boolean).forEach(s=>TJ.photos.push(s));drawPhotos();tlive()});e.target.value=''}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-on-input]');if(el&&IN[el.dataset.onInput])IN[el.dataset.onInput](el,e)});
/* form titip: handler input dipasang di <form>, event 'input' dari child naik ke form */
route();
})();
</script>
</body>
